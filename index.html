<!DOCTYPE html>
<html lang="en">
    
    <head>
        
        <meta charset="UTF-8">
        <meta name = "viewport", content = "width=device-width, initial-scale=1.0">
        
        <link rel = "stylesheet" href = "./styles/sizing.css">
        <link rel = "stylesheet" href = "./styles/textures.css">
        <script type="module" src="./scripts/main.js"></script>
        
        <title>Bedazzled: Bejeweled 2 Endless Mode Imitation</title>

    </head>
    
    <body>
        
       <div id = "board">
           
           <div id = "display">
               
               <canvas id = "canvas" width="512" height="512"></canvas>
               
               <div id = "progress">
                   
                   <div id = "completed"></div>
                   <div id = "remaining"></div>
                   
               </div>
               
           </div>
           
       </div>
       
       <div id = "interface">
           
            <h1 id = "logo">BEDAZZLED</h1>
            <div id = "scores" class = "container">
                
               <p id="score">
                   0
               </p>
               
               <p id="level">
                   1
               </p>
               
           </div>
           
           <div id="gap"></div>
           
           <div id = "buttons" class = "container">
               
               <button id="hint">HINT</button>
               <button id="menu">MENU</button>
               
           </div>
           
       </div>
       
    </body>
    
</html>
